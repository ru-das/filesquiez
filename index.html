<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FileSquiez - squiez your files to size</title>
  <meta name="description" content="Compress images, PDFs and documents to the exact size you want. Everything runs in your browser.">
  <meta name="theme-color" content="#dcdfde">
  <script>try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff5a1f'/%3E%3Cpath d='M5 11h8V5M27 11h-8V5M5 21h8v6M27 21h-8v6' stroke='%231b1d1c' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/unbounded-title.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8M16 13H8M16 17H8"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
    <symbol id="i-shrink" viewBox="0 0 24 24"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </svg>

  <main>
    <header>
      <div class="bar">
        <h1 aria-label="FileSquiez">File<span>Squiez</span></h1>
        <button id="theme" class="pill" type="button" aria-label="Dark mode" aria-pressed="false">
          <span class="knob"></span>
          <svg class="i sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="i moon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </div>
      <p class="tag"><svg class="i" aria-hidden="true"><use href="#i-shield"/></svg>Compress any file to the size you want. Nothing leaves your browser.</p>
    </header>

    <section class="card top">
      <label id="drop" class="drop" tabindex="0">
        <input id="file" type="file" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-upload"/></svg>
        <strong>Drop a file here</strong>
        <span class="muted">or <span class="verb fine">click</span><span class="verb coarse">tap</span> to browse &middot; images, PDFs, documents, code</span>
      </label>

      <div id="chip" class="chip" hidden>
        <svg class="i" aria-hidden="true"><use id="chipIcon" href="#i-file"/></svg>
        <span id="chipName" class="name"></span>
        <span id="chipSize" class="size num"></span>
        <button id="clear" class="icon-btn" type="button" aria-label="Remove file"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>

      <div class="controls">
        <div class="ctl">
          <label class="lbl" for="size">Target size</label>
          <div class="field">
            <input id="size" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="20" placeholder="20 or 1.5 mb">
            <div id="unit" class="seg" role="radiogroup" aria-label="Size unit">
              <button type="button" role="radio" aria-checked="true" data-value="1024">KB</button>
              <button type="button" role="radio" aria-checked="false" data-value="1048576" tabindex="-1">MB</button>
            </div>
          </div>
        </div>
        <button id="go" class="go" type="button" disabled><svg class="i" aria-hidden="true"><use href="#i-shrink"/></svg><span>Squiez</span></button>
      </div>

      <div id="progress" hidden>
        <div class="track" role="progressbar" aria-label="Compression progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
        <span id="status" role="status"></span>
      </div>
    </section>

    <section id="out" class="card out" aria-live="polite">
      <div class="empty"><svg class="i" aria-hidden="true"><use href="#i-file"/></svg>Your compressed file will appear here.</div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
